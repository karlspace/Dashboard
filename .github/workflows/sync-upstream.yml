# Sync Upstream - uses the shared reusable workflow.
#
# IMPORTANT (Dashboard specific): the `workspace/current` branch carries
# fork-local changes that CONFLICT with upstream and MUST be preserved.
# We therefore do NOT auto-merge upstream into workspace here (that would
# conflict on every run). This job only keeps the `dev` mirror branch in
# sync with upstream (gethomepage/homepage) - the equivalent of GitHub's
# "Sync fork" button.
#
# Integrate `dev -> workspace/current` MANUALLY via the bg-fork-sync skill,
# which resolves conflicts with feature preservation.

name: 🔄 Sync Upstream

on:
  schedule:
    - cron: "0 4 1 * *" # monthly, 1st at 04:00 UTC
  workflow_dispatch:
    inputs:
      mirror-branch:
        description: "Fork branch to sync from upstream"
        required: false
        default: "dev"
      dry-run:
        description: "Only verify the fork relationship; change nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync Mirror with Upstream
    uses: bauer-group/automation-templates/.github/workflows/sync-upstream.yml@main
    with:
      mirror-branch: ${{ github.event.inputs.mirror-branch || 'dev' }}
      # Mirror-only: workspace integration is manual (feature preservation).
      integrate-into: ""
      dry-run: ${{ github.event.inputs.dry-run == 'true' }}
    secrets: inherit
